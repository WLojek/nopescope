name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Rule matching
        run: node test/rules.test.mjs
      - name: Site adapters (headless Chrome)
        run: node test/adapters.test.mjs
      - name: Syntax check of the bundles
        run: npx esbuild src/background.js src/offscreen.js src/content/index.js src/options/options.js src/popup/popup.js --bundle --outdir=/tmp/nopescope-check --format=esm --log-level=warning
